[workspace]
resolver = "2"
members = ["test", "db/migrations", "db/entities", "app/controllers", "app/views", "config", "bin"]

[workspace.dependencies]
serde = { version = "^1.0", features = ["derive"] }
tracing = "^0.1"
async-trait = "^0.1"
anyhow = "^1.0"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }
chrono = "^0.4"
hotwatch = "^0.5"
serde_json = "^1.0"
tera = "^1.20"
thiserror = "^2.0"
dotenvy = "^0.15"
tokio = { version = "^1.44", features = ["macros", "rt-multi-thread", "signal"] }
axum = { version = "^0.8", features = ["tokio", "ws"] }
tower = { version = "^0.5", features = ["balance", "limit", "load-shed", "timeout", "tracing"] }
tower-http = { version = "^0.6", features = ["fs", "timeout", "trace"] }
sea-orm = { version = "^1.1", features = ["sqlx-sqlite"] }

